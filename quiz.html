<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест: насколько хорошо ты её знаешь?</title><link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--accent:#e05580;--bg:#fff5f7;--dark:#3a2b3d}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Verdana,sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:90px 16px 60px;overflow-x:hidden}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
nav{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;gap:28px;padding:14px 10px;background:rgba(255,245,247,.85);backdrop-filter:blur(8px);z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.05)}
nav a{color:var(--dark);text-decoration:none;font-weight:600;font-size:15px;transition:color .3s}
nav a:hover{color:var(--accent)}
nav a.active{color:var(--accent);border-bottom:2px solid var(--accent)}
.quiz-card{background:#fff;max-width:560px;width:100%;border-radius:22px;box-shadow:0 15px 40px rgba(58,43,61,.12);padding:34px 30px;position:relative;z-index:1}
.progress{height:8px;background:#f3dfe6;border-radius:6px;margin-bottom:26px;overflow:hidden}
.progress div{height:100%;width:0;background:linear-gradient(90deg,#e05580,#f7a1bf);border-radius:6px;transition:width .5s}
.qnum{color:var(--accent);font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase}
h2.q{font-size:22px;margin:10px 0 24px;min-height:2.6em}
.opts{display:grid;gap:12px}
button.opt{padding:14px 18px;border:2px solid #f0d5de;background:#fff;border-radius:14px;font-size:16px;cursor:pointer;transition:.25s;text-align:left;font-family:inherit;color:var(--dark)}
button.opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(6px)}
button.opt:disabled{cursor:default}
button.opt.correct{background:#e8f8ee;border-color:#4caf7d;color:#2e7d55}
button.opt.wrong{background:#fdeaea;border-color:#e26d6d;color:#b33737;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fade{animation:fade .45s}
@keyframes fade{from{opacity:0;transform:translateY(16px)}to{opacity:1}}
.result{text-align:center;display:none}
.score{font-size:52px;font-weight:800;color:var(--accent)}
.hearts-meter{font-size:32px;letter-spacing:4px;margin:18px 0}
.result p{margin:14px 0 26px;font-size:18px}
.restart{background:var(--accent);color:#fff;border:none;padding:14px 30px;border-radius:30px;font-size:16px;font-weight:700;cursor:pointer;transition:.3s;font-family:inherit}
.restart:hover{transform:scale(1.06)}
.tip{margin-top:18px;color:#b08fa0;font-size:13px;text-align:center;position:relative;z-index:1}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<nav>
  <a href="index.html">Главная</a>
  <a href="moments.html">Наши моменты</a>
  <a href="quiz.html" class="active">Тест</a>
</nav>
<div class="quiz-card">
  <div class="progress"><div id="bar"></div></div>
  <div id="quiz">
    <div class="qnum" id="qnum"></div>
    <h2 class="q" id="qtext"></h2>
    <div class="opts" id="opts"></div>
  </div>
  <div class="result" id="result">
    <div class="score" id="score"></div>
    <div class="hearts-meter" id="meter"></div>
    <p id="verdict"></p>
    <button class="restart" onclick="start()">Пройти ещё раз</button>
  </div>
</div>
<script>
// ===== ВОПРОСЫ: отредактируйте под вашу пару =====
// q — вопрос, o — варианты ответов, a — индекс правильного (считается с 0)
const questions = [
  { q: 'Какой фильм она может пересматривать бесконечно?', o: ['«Звёздные войны»', '«До встречи с тобой»', '«Пилаты Калибского моля 1»', 'Ёлки 1»'], a: 2 },
  { q: 'Какой у неё самый любимый цвет?', o: ['Красный', 'Синий', 'Розовый', 'Зелёный'], a: 0 },
  { q: 'Что она выберет на ужин?', o: ['Пиццу', 'Пасту карбонара', 'Суши', 'Домашние пельмени'], a: 2 },
  { q: 'Какое время года она любит больше всего?', o: ['Лето', 'Осень', 'Зиму', 'Весну'], a: 2 },
  { q: 'О чём она мечтает больше всего?', o: ['Попутешествовать по миру', 'Завести бобаку', 'Открыть своё дело', 'Научиться вязать'], a: 0 },
  { q: 'Кого из знаменитостей она обожает?', o: ['Джонни Депп', 'Селену Гомез', 'Бенеддикта Кэмбербэтча', 'Роберт Дауни мл.'], a: 1 }
];

let cur = 0, score = 0;

function start(){
  cur = 0; score = 0;
  document.getElementById('result').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  render();
}

function render(){
  const q = questions[cur];
  document.getElementById('qnum').textContent = 'Вопрос ' + (cur + 1) + ' из ' + questions.length;
  const qt = document.getElementById('qtext');
  qt.textContent = q.q;
  const card = document.getElementById('quiz');
  card.classList.remove('fade'); void card.offsetWidth; card.classList.add('fade');
  const box = document.getElementById('opts');
  box.innerHTML = '';
  q.o.forEach(function(opt, i){
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = opt;
    b.onclick = function(){ answer(i, b); };
    box.appendChild(b);
  });
  document.getElementById('bar').style.width = (cur / questions.length * 100) + '%';
}

function answer(i, btn){
  const q = questions[cur];
  const btns = document.querySelectorAll('.opt');
  btns.forEach(function(b){ b.disabled = true; });
  if (i === q.a){ btn.classList.add('correct'); score++; }
  else { btn.classList.add('wrong'); btns[q.a].classList.add('correct'); }
  setTimeout(function(){
    cur++;
    if (cur < questions.length) render(); else finish();
  }, 1000);
}

function finish(){
  const total = questions.length;
  document.getElementById('quiz').style.display = 'none';
  const r = document.getElementById('result');
  r.style.display = 'block';
  r.classList.remove('fade'); void r.offsetWidth; r.classList.add('fade');
  document.getElementById('bar').style.width = '100%';
  document.getElementById('score').textContent = score + ' / ' + total;
  document.getElementById('meter').textContent = '❤️'.repeat(score) + '🤍'.repeat(total - score);
  let v;
  if (score <= 2)      v = 'Похоже, её ещё стоит узнать получше 😉 Сайт вам в помощь!';
  else if (score <= 4) v = 'Неплохо! Но лучшие главы этой истории ещё впереди.';
  else if (score < total) v = 'Почти идеально! Вы явно много значит для того, кто это написал.';
  else                 v = 'Идеально! Вы знаете её как свои пять пальцев ❤️';
  document.getElementById('verdict').textContent = v;
  if (score >= total - 1) boom();
}

// ===== Конфетти =====
const c = document.getElementById('confetti'), cx = c.getContext('2d');
let CW, CH;
function cr(){ CW = c.width = innerWidth; CH = c.height = innerHeight; }
cr(); addEventListener('resize', cr);
let parts = [];
const colors = ['#e05580', '#f7a1bf', '#ffd166', '#8ecae6', '#b7e4c7'];
function boom(){
  for (let i = 0; i < 180; i++){
    parts.push({
      x: CW / 2, y: CH / 2,
      vx: (Math.random() - .5) * 15,
      vy: (Math.random() - .9) * 15,
      g: .25, s: 5 + Math.random() * 7,
      c: colors[Math.floor(Math.random() * colors.length)],
      r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, life: 130
    });
  }
}
(function loop(){
  cx.clearRect(0, 0, CW, CH);
  parts.forEach(function(p){
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
    cx.fillStyle = p.c; cx.fillRect(-p.s/2, -p.s/2, p.s, p.s * .6);
    cx.restore();
  });
  parts = parts.filter(function(p){ return p.life > 0 && p.y < CH + 40; });
  requestAnimationFrame(loop);
})();

start();
</script>
</body>
</html>
